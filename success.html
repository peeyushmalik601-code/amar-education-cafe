<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sending to WhatsApp... | Amar Educational Cafe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .redirect-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            border: 1px solid #25d366;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(37, 211, 102, 0.2);
            border-top: 5px solid #25d366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 28px;
            color: #25d366;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            opacity: 0.8;
            line-height: 1.6;
        }
        .countdown {
            font-size: 40px;
            font-weight: bold;
            color: #25d366;
            margin: 10px 0;
        }
        .manual-link {
            display: inline-block;
            color: #25d366;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="loader"></div>
        <h2>Opening WhatsApp...</h2>
        <p>Please wait, you'll be redirected automatically.</p>
        <div class="countdown" id="countdown">2</div>
        <p style="font-size:14px; opacity:0.7;">Sending your enrollment details to Amar Education Cafe</p>
        <a id="whatsappLink" class="manual-link" href="#">Click here if not redirected</a>
    </div>

    <script>
        // Coaching ka WhatsApp number
        const coachingNumber = "918057232954";
        
        // URL se data parse karo
        const params = new URLSearchParams(window.location.search);
        const name = decodeURIComponent(params.get('name') || '');
        const studentClass = decodeURIComponent(params.get('class') || '');
        const batch = decodeURIComponent(params.get('batch') || '');
        const phone = decodeURIComponent(params.get('phone') || '');
        const subjects = decodeURIComponent(params.get('subjects') || 'Not Selected');
        
        // Message format
        const message = `📋 *New Batch Enrollment* %0A%0A` +
                        `👤 *Name:* ${name} %0A` +
                        `🏫 *Class:* ${studentClass} %0A` +
                        `⏰ *Batch:* ${batch} %0A` +
                        `📞 *Phone:* ${phone} %0A` +
                        `📚 *Subjects:* ${subjects} %0A%0A` +
                        `_Kindly provide fee details._`;
        
        // WhatsApp URL
        const whatsappUrl = `https://wa.me/${coachingNumber}?text=${message}`;
        
        // Manual link bhi set karo
        document.getElementById('whatsappLink').href = whatsappUrl;
        
        // Countdown + Auto Redirect
        let seconds = 2;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = whatsappUrl;
            }
        }, 1000);
    </script>
</body>
</html>
