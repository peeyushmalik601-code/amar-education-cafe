<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll for Batch | Amar Educational Cafe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255,165,0,0.3);
        }
        h1 {
            text-align: center;
            color: #ffa500;
            margin-bottom: 10px;
            font-size: 36px;
        }
        p.subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffa500;
        }
        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input::placeholder { color: rgba(255,255,255,0.5); }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            color: #fff;
        }
        button {
            background: #ffa500;
            color: #000;
            font-weight: 700;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #fff;
            box-shadow: 0 10px 30px rgba(255,165,0,0.5);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #ffa500;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Enroll for a Batch</h1>
        <p class="subtitle">Fill in your details and we'll get back to you!</p>

        <!-- Form ab JavaScript se handle hoga -->
        <form id="enrollmentForm" onsubmit="return handleSubmit(event)">
            
            <label for="name">Student's Full Name *</label>
            <input type="text" id="name" name="name" placeholder="Aman Sharma" required>

            <label for="class">Class *</label>
            <select id="class" name="class" required>
                <option value="">Select Class</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>

            <label for="batch">Preferred Batch Timing *</label>
            <select id="batch" name="batch" required>
                <option value="">Choose Batch</option>
                <option value="3:30-4:30">3:30 PM – 4:30 PM</option>
                <option value="4:30-5:30">4:30 PM – 5:30 PM</option>
                <option value="5:30-6:30">5:30 PM – 6:30 PM</option>
            </select>

            <label>Subjects You'd Like to Study (Tick all that apply)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="subjects" value="Mathematics"> Mathematics</label>
                <label><input type="checkbox" name="subjects" value="Physics"> Physics</label>
                <label><input type="checkbox" name="subjects" value="Chemistry"> Chemistry</label>
                <label><input type="checkbox" name="subjects" value="Biology"> Biology</label>
                <label><input type="checkbox" name="subjects" value="English"> English</label>
            </div>

            <label for="phone">Phone Number (Optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="+91 9876543210">

            <button type="submit">Submit & Next Step</button>
        </form>
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Default submit roko
            
            // Data collect karo
            const name = document.getElementById('name').value.trim();
            const studentClass = document.getElementById('class').value;
            const batch = document.getElementById('batch').value;
            const phone = document.getElementById('phone').value.trim();
            
            // Subjects collect karo
            const checkedSubjects = document.querySelectorAll('input[name="subjects"]:checked');
            const subjects = [];
            checkedSubjects.forEach(cb => subjects.push(cb.value));
            const subjectsStr = subjects.join(', ');
            
            // Success page ke URL mein data daalo
            const params = new URLSearchParams();
            params.append('name', encodeURIComponent(name));
            params.append('class', encodeURIComponent(studentClass));
            params.append('batch', encodeURIComponent(batch));
            params.append('phone', encodeURIComponent(phone));
            params.append('subjects', encodeURIComponent(subjectsStr));
            
            // Redirect to success page with parameters
            window.location.href = 'success.html?' + params.toString();
            return false;
        }
    </script>
</body>
</html>
