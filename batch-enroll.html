<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll for Batch | Amar Educational Cafe</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=1">

    <!-- 🔒 Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self';
        img-src 'self' data:;
        form-action 'self';
        object-src 'none';
    ">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255,165,0,0.3);
        }
        h1 {
            text-align: center;
            color: #ffa500;
            margin-bottom: 10px;
            font-size: 36px;
        }
        p.subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffa500;
        }
        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,165,0,0.2);
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 16px;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #ffa500;
            box-shadow: 0 0 10px rgba(255,165,0,0.2);
        }
        input::placeholder { color: rgba(255,255,255,0.5); }
        select option { background: #1a1a2e; color: #fff; }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            color: #fff;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ffa500;
        }
        
        button {
            background: #ffa500;
            color: #000;
            font-weight: 700;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        button:hover {
            background: #fff;
            box-shadow: 0 10px 30px rgba(255,165,0,0.5);
        }
        button:active {
            transform: scale(0.98);
        }
        
        .error-msg {
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #ffa500;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .back-link a:hover {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 25px 20px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Enroll for a Batch</h1>
        <p class="subtitle">Fill in your details and we'll get back to you!</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="enrollmentForm" onsubmit="return handleSubmit(event)" autocomplete="off">
            
            <label for="name">Student's Full Name *</label>
            <input type="text" id="name" name="name" placeholder="Aman Sharma" required maxlength="100">

            <label for="class">Class *</label>
            <select id="class" name="class" required>
                <option value="">Select Class</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>

            <label for="batch">Preferred Batch Timing *</label>
            <select id="batch" name="batch" required>
                <option value="">Choose Batch</option>
                <option value="3:30-4:30">3:30 PM – 4:30 PM</option>
                <option value="4:30-5:30">4:30 PM – 5:30 PM</option>
                <option value="5:30-6:30">5:30 PM – 6:30 PM</option>
            </select>

            <label>Subjects You'd Like to Study (Tick all that apply)</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="subjects" value="Mathematics"> Mathematics</label>
                <label><input type="checkbox" name="subjects" value="Physics"> Physics</label>
                <label><input type="checkbox" name="subjects" value="Chemistry"> Chemistry</label>
                <label><input type="checkbox" name="subjects" value="Biology"> Biology</label>
                <label><input type="checkbox" name="subjects" value="English"> English</label>
            </div>

            <label for="phone">Phone Number (Optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" maxlength="15">

            <button type="submit">Submit & Next Step</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        // 🔒 Rate limiting - 3 seconds between submissions
        let lastSubmitTime = 0;

        function handleSubmit(event) {
            event.preventDefault();
            
            // Rate limiting check
            const now = Date.now();
            if (now - lastSubmitTime < 3000) {
                showError('⚠️ Please wait a moment before submitting again.');
                return false;
            }
            lastSubmitTime = now;
            
            // Hide any previous error
            hideError();
            
            // Collect & sanitize data
            const name = document.getElementById('name').value.trim();
            const studentClass = document.getElementById('class').value;
            const batch = document.getElementById('batch').value;
            const phone = document.getElementById('phone').value.trim();
            
            // Validate required fields
            if (!name || !studentClass || !batch) {
                showError('❌ Please fill all required fields!');
                return false;
            }
            
            // Validate name length
            if (name.length < 2) {
                showError('❌ Please enter a valid name.');
                return false;
            }
            
            // Validate phone format (if provided)
            if (phone && !/^\+?[\d\s\-()]{7,15}$/.test(phone)) {
                showError('❌ Please enter a valid phone number.');
                return false;
            }
            
            // Collect checked subjects
            const checkedSubjects = document.querySelectorAll('input[name="subjects"]:checked');
            const subjects = [];
            checkedSubjects.forEach(cb => subjects.push(cb.value));
            const subjectsStr = subjects.join(', ');
            
            // Build URL params safely
            const params = new URLSearchParams();
            params.append('name', encodeURIComponent(name));
            params.append('class', encodeURIComponent(studentClass));
            params.append('batch', encodeURIComponent(batch));
            params.append('phone', encodeURIComponent(phone));
            params.append('subjects', encodeURIComponent(subjectsStr));
            
            // Redirect to success page
            window.location.href = 'success.html?' + params.toString();
            return false;
        }
        
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            // Auto-hide after 4 seconds
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }
        
        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }
    </script>
</body>
</html>
